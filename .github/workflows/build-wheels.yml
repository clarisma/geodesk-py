name: Build Wheels

on:
  push:
    tags:
      # Release candidates only, e.g. v1.2.3-rc1. The final tag (v1.2.3)
      # is created by the publish_release job and deliberately does not
      # match this pattern, so it cannot re-trigger this workflow.
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

jobs:
  check_tag:
    name: Validate tag and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse release version from tag
        id: parse
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release candidate tag (expected vMAJOR.MINOR.PATCH-rcN)"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release candidate $tag will publish version $version"

      - name: Check that the release notes exist
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          notes="doc/releases/v$VERSION.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi

      - name: Check that the release tag does not already exist
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check_tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [windows-latest, ubuntu-latest]
        # suppress MacOS for now due to lack of proper C++20 support
        os: [windows-2022, ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: 'recursive'

      - name: Force update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_PRERELEASE_PYTHONS: 1
          CIBW_SKIP: '*win32 *i686'   # Don't build for 32-bit
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_ENVIRONMENT: MACOSX_DEPLOYMENT_TARGET=11.0
          CMAKE_GENERATOR: Ninja
          CIBW_BEFORE_BUILD_WINDOWS: >
            python -m pip install "cmake>=4.2" "ninja"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          overwrite: true

  test_wheels:
    name: Test wheels on Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest, macOS-latest]
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          # Download only the wheels artifact for the current OS
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install and test the built wheel
        run: |
          pip install --find-links wheelhouse geodesk
          pip install pytest
          cd test
          pytest test_basic.py

  upload_wheels:
    name: Upload Wheels to PyPI
    needs: test_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          # Omitting the name parameter downloads all artifacts from previous jobs
          path: wheelhouse
      - name: List downloaded wheels
        run: ls -l wheelhouse
      - name: Flatten wheels directory
        run: |
          # Move all .whl files from subdirectories to the wheelhouse folder
          find wheelhouse -type f -name "*.whl" -exec mv {} wheelhouse/ \;
          # Optionally, list the flattened directory for verification
          ls -l wheelhouse
      - name: Set up Python for twine
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Publish to PyPI
        run: |
          python -m pip install twine
          twine upload --skip-existing --non-interactive -u __token__ -p ${{ secrets.PYPI_TOKEN_GLOBAL }} wheelhouse/*.whl

  publish_release:
    name: Tag and publish release
    needs: [check_tag, upload_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check_tag.outputs.version }}
    steps:
      # Checks out the commit the release candidate tag points to, so the
      # final tag ends up on exactly the code that was built and uploaded.
      - uses: actions/checkout@v4

      - name: Create and push tag v${{ needs.check_tag.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Version $VERSION" \
            --notes-file "doc/releases/v$VERSION.md"